name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  test:
    name: Test tagged source
    runs-on: depot-ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out tagged source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  push:
    name: Bump manifest and push
    needs: test
    runs-on: depot-ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Check out tagged source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Synchronize release metadata
        id: version
        # domain/name catalog id support
        uses: adversarylabs/actions/version@v1
        with:
          tag: ${{ github.ref_name }}
          path: .
          branch: main
          token: ${{ secrets.RELEASE_GITHUB_TOKEN }}
          sync-npm: auto

      - name: Push adversary
        id: push
        # domain/name remote refs
        uses: adversarylabs/actions/push@v1
        with:
          # 2026.8.3+ publishes README.md and CHECKS.md as catalog OCI referrers.
          path: .
          token: ${{ secrets.ADVERSARY_SERVICE_ACCOUNT_TOKEN }}
          # CI is the publish authority — full catalog path, no adversarylabs/ prefix.
          remote-reference: registry.adversarylabs.ai/${{ steps.version.outputs.name }}:${{ steps.version.outputs.version }}
          push-latest: true

      # Official signature for host-execution trust.
      # Prod private seed: Depot secret ADVERSARY_OFFICIAL_SIGNING_SEED
      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: "1.24.x"

      - name: Sign catalog package
        env:
          ADVERSARY_OFFICIAL_SIGNING_SEED: ${{ secrets.ADVERSARY_OFFICIAL_SIGNING_SEED }}
          ADVERSARY_SERVICE_ACCOUNT_TOKEN: ${{ secrets.ADVERSARY_SERVICE_ACCOUNT_TOKEN }}
          REMOTE_REF: ${{ steps.push.outputs.reference }}
          SUBJECT_DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          if [[ -z "${ADVERSARY_OFFICIAL_SIGNING_SEED:-}" ]]; then
            echo "ADVERSARY_OFFICIAL_SIGNING_SEED is required (Depot org/repo secret)" >&2
            exit 1
          fi
          if [[ -z "${REMOTE_REF:-}" || -z "${SUBJECT_DIGEST:-}" ]]; then
            echo "push action did not output reference/digest" >&2
            exit 1
          fi
          # Signer only needs private seed + key-id; user CLIs verify with release public key.
          GOBIN="${RUNNER_TEMP}/bin" go install github.com/adversarylabs/adversary@2026.9.4
          export PATH="${RUNNER_TEMP}/bin:$PATH"
          printf '%s\n' "$ADVERSARY_SERVICE_ACCOUNT_TOKEN" | adversary login --token-stdin --profile sign --registry-namespace adversarylabs
          trap 'adversary --profile sign logout --local-only >/dev/null 2>&1 || true' EXIT
          adversary --profile sign sign "$REMOTE_REF" \
            --digest "$SUBJECT_DIGEST" \
            --key-id official-prod
