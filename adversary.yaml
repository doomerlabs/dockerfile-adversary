name: adversarylabs/container/dockerfile
version: 0.0.21
description: Reviews Dockerfile-style files for container build and runtime security concerns.

triggers:
  manual: true
  files_changed:
    - Dockerfile
    - "**/Dockerfile"
    - Dockerfile.*
    - "**/Dockerfile.*"
    - "*.dockerfile"
    - "**/*.dockerfile"

detection:
  files:
    - "Dockerfile"
    - "**/Dockerfile"
    - "Dockerfile.*"
    - "**/Dockerfile.*"
    - "*.dockerfile"
    - "**/*.dockerfile"
    - ".dockerignore"
    - "**/.dockerignore"

runtime:
  name: node
  version: "22"
  command:
    - dist/index.js

permissions:
  filesystem:
    read:
      - .
    write:
      - .adversary/results
  network: false
  model: true
  environment:
    allow: []

findings:
  format: adversary.review.v1
